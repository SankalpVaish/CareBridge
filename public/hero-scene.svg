<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Rolling rural hills under a warm sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="55%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="640" cy="90" r="120" fill="#fef9c3" opacity="0.55"/>
  <circle cx="640" cy="90" r="46" fill="#fef08a" opacity="0.8"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="180" cy="80" rx="60" ry="18"/>
    <ellipse cx="230" cy="92" rx="48" ry="15"/>
    <ellipse cx="430" cy="60" rx="52" ry="15"/>
  </g>

  <!-- back hills -->
  <path d="M0 250 Q 160 190 330 240 T 800 220 L800 400 L0 400 Z" fill="url(#hillBack)"/>
  <!-- mid hills -->
  <path d="M0 300 Q 220 240 430 300 T 800 290 L800 400 L0 400 Z" fill="url(#hillMid)"/>
  <!-- a winding road -->
  <path d="M360 400 Q 400 330 470 320 Q 560 305 560 260" fill="none" stroke="#f8fafc" stroke-width="14" opacity="0.85" stroke-linecap="round"/>
  <path d="M360 400 Q 400 330 470 320 Q 560 305 560 260" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-dasharray="2 18" opacity="0.9" stroke-linecap="round"/>
  <!-- front hill -->
  <path d="M0 340 Q 240 300 520 345 T 800 350 L800 400 L0 400 Z" fill="url(#hillFront)"/>

  <!-- a couple of trees -->
  <g>
    <rect x="120" y="300" width="6" height="22" fill="#15803d"/>
    <circle cx="123" cy="296" r="18" fill="#16a34a"/>
    <rect x="690" y="286" width="7" height="26" fill="#15803d"/>
    <circle cx="693" cy="280" r="22" fill="#16a34a"/>
  </g>
</svg>
